services:
  - type: web
    name: captains-table-webmcp
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: CAPTAINS_TABLE_DB
        value: /var/data/captains-table.sqlite3
    disk:
      name: captains-table-data
      mountPath: /var/data
      sizeGB: 1
